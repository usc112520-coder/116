    function App() {
      const [activeTab, setActiveTab] = useState('planner');
      const [viewMode, setViewMode] = useState('table');
      const [userName, setUserName] = useState(() => '使用者_' + Math.floor(Math.random() * 899 + 100));
      const [courses, setCourses] = useState(() => {
        const saved = localStorage.getItem('dmd_116_courses');
        return saved ? JSON.parse(saved) : INITIAL_COURSES;
      });
      const [history, setHistory] = useState([]);
      const [showHistoryModal, setShowHistoryModal] = useState(false);
      const [editCourse, setEditCourse] = useState(null);
      const [draggedCourseId, setDraggedCourseId] = useState(null);
      const [dragOverCell, setDragOverCell] = useState(null);
      const [isCloudConnected, setIsCloudConnected] = useState(false);

      const supabaseRef = useRef(null);

      // Save Local Backup
      useEffect(() => {
        localStorage.setItem('dmd_116_courses', JSON.stringify(courses));
      }, [courses]);

      useEffect(() => {
        if (!window.supabase || !SUPABASE_CONFIG.url || SUPABASE_CONFIG.url === "YOUR_SUPABASE_URL") return;

        try {
          const client = window.supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.anonKey);
          supabaseRef.current = client;

          // 讀取初始資料
          const loadInitialData = async () => {
            const { data } = await client
              .from('curriculum')
              .select('*')
              .eq('id', 'dmd_116_plan')
              .maybeSingle();

            if (data) {
              if (data.courses) setCourses(data.courses);
              if (data.history) setHistory(data.history || []);
              setIsCloudConnected(true);
            }
          };

          loadInitialData();

          // 訂閱 Supabase Realtime 推播
          const channel = client
            .channel('public:curriculum')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'curriculum' }, (payload) => {
              if (payload.new) {
                if (payload.new.courses) setCourses(payload.new.courses);
                if (payload.new.history) setHistory(payload.new.history || []);
                setIsCloudConnected(true);
              }
            })
            .subscribe((status) => {
              if (status === 'SUBSCRIBED') {
                setIsCloudConnected(true);
              }
            });

          return () => {
            client.removeChannel(channel);
          };
        } catch (err) {
          console.warn("Supabase connection error, fallback to local mode:", err);
        }
      }, []);

      const syncToCloud = async (newCourses, newHistory) => {
        if (supabaseRef.current) {
          try {
            await supabaseRef.current
              .from('curriculum')
              .upsert({
                id: 'dmd_116_plan',
                courses: newCourses,
                history: newHistory,
                last_updated_by: userName,
                updated_at: new Date().toISOString()
              });
          } catch (err) {
            console.error("Supabase sync failed:", err);
          }
        }
      };

      // 計算總計與個別學期的詳細分類小計
      const stats = useMemo(() => {
        const counts = { 校必: 0, 院必: 0, 系必: 0, 系選: 0, 自由選修: 0, totalElectives: 0, totalRequired: 0, total: 0 };
        const semesterDetails = {};

        SEMESTERS.forEach(s => { 
          semesterDetails[s.id] = { 校必: 0, 院必: 0, 系必: 0, 系選: 0, 自由選修: 0, 必修合計: 0, 選修合計: 0, total: 0 }; 
        });

        courses.forEach(c => {
          const cr = Number(c.credits) || 0;
          if (counts[c.category] !== undefined) {
            counts[c.category] += cr;
          }

          if (c.semester && semesterDetails[c.semester]) {
            semesterDetails[c.semester][c.category] = (semesterDetails[c.semester][c.category] || 0) + cr;
            
            // 計算必修 vs 選修
            if (['校必', '院必', '系必'].includes(c.category)) {
              semesterDetails[c.semester].必修合計 += cr;
            } else {
              semesterDetails[c.semester].選修合計 += cr;
            }
            semesterDetails[c.semester].total += cr;
          }

          counts.total += cr;
        });

        counts.totalElectives = counts.系選 + counts.自由選修;
        counts.totalRequired = counts.校必 + counts.院必 + counts.系必;
        return { counts, semesterDetails };
      }, [courses]);

      const addHistoryLog = (actionText, updatedCourses) => {
        const timeStr = new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });
        const logItem = { user: userName, action: actionText, timestamp: timeStr };
        const newHistory = [logItem, ...history].slice(0, 30);
        setHistory(newHistory);
        syncToCloud(updatedCourses, newHistory);
      };

      const handleDragStart = (e, courseId) => {
        e.dataTransfer.setData('text/plain', courseId);
        setDraggedCourseId(courseId);
      };

      const handleDragOverCell = (e, catKey, semId) => {
        e.preventDefault();
        setDragOverCell(`${catKey}_${semId}`);
      };

      const handleDropCell = (e, targetCat, targetSem) => {
        e.preventDefault();
        setDragOverCell(null);
        const courseId = e.dataTransfer.getData('text/plain') || draggedCourseId;
        if (!courseId) return;

        handleMoveCourseMatrix(courseId, targetCat, targetSem);
      };

      const handleMoveCourseMatrix = (courseId, newCategory, newSemester) => {
        const target = courses.find(c => c.id === courseId);
        if (!target) return;

        if (target.category === newCategory && target.semester === newSemester) return;

        const newSemObj = SEMESTERS.find(s => s.id === newSemester);
        const updated = courses.map(c => 
          c.id === courseId ? { ...c, category: newCategory, semester: newSemester } : c
        );

        setCourses(updated);
        addHistoryLog(`將《${target.name}》移至 ${newSemObj ? newSemObj.label : newSemester} (${newCategory})`, updated);
      };

      const handleSaveCourse = (savedCourse) => {
        let updated;
        let actionText = '';
        const exists = courses.some(c => c.id === savedCourse.id);

        if (exists) {
          updated = courses.map(c => c.id === savedCourse.id ? savedCourse : c);
          actionText = `編輯課程《${savedCourse.name}》`;
        } else {
          updated = [...courses, savedCourse];
          actionText = `新增課程《${savedCourse.name}》(${savedCourse.credits}學分)`;
        }

        setCourses(updated);
        setEditCourse(null);
        addHistoryLog(actionText, updated);
      };

      const handleDeleteCourse = (courseId) => {
        const target = courses.find(c => c.id === courseId);
        if (!target) return;

        const updated = courses.filter(c => c.id !== courseId);
        setCourses(updated);
        setEditCourse(null);
        addHistoryLog(`刪除課程《${target.name}》`, updated);
      };

      const handleResetDefault = () => {
        setCourses(INITIAL_COURSES);
        addHistoryLog(`重設課表為預設 116學年 版`, INITIAL_COURSES);
      };

                    onClick={() => setActiveTab('planner')}
                    className={`px-3 py-1.5 rounded-lg transition ${activeTab === 'planner' ? 'bg-white text-indigo-700 shadow-xs font-semibold' : 'text-slate-600 hover:text-slate-900'}`}
                  >
                    <i className="fa-solid fa-table-cells mr-1.5"></i> 課表地圖
                  </button>
                  <button 
                    onClick={() => setActiveTab('rules')}
                    className={`px-3 py-1.5 rounded-lg transition ${activeTab === 'rules' ? 'bg-white text-indigo-700 shadow-xs font-semibold' : 'text-slate-600 hover:text-slate-900'}`}
                  >
                    <i className="fa-solid fa-graduation-cap mr-1.5"></i> 畢業門檻
                  </button>
                </nav>

                {activeTab === 'planner' && (
                  <div className="hidden sm:flex bg-slate-100 p-1 rounded-xl text-xs font-medium border border-slate-200">
                    <button 
                      onClick={() => setViewMode('table')}

                  <select 
                    value={formData.semester}
                    onChange={(e) => setFormData({ ...formData, semester: e.target.value })}
                    className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-slate-900 focus:border-indigo-500 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-100 transition"
                  >
                    {SEMESTERS.map(s => (
                      <option key={s.id} value={s.id}>{s.label}</option>
                    ))}
                  </select>
                </div>
              </div>

              <div className="flex justify-between items-center pt-4 border-t border-slate-100">
                {course.name ? (
                  <button 
                    type="button"
                    onClick={() => onDelete(course.id)}
                    className="bg-red-50 text-red-600 hover:bg-red-100 border border-red-200 px-3 py-2 rounded-xl transition font-medium"
                  >
                    <i className="fa-solid fa-trash mr-1"></i> 刪除
                  </button>
                ) : <div></div>}

                <div className="flex space-x-2">
                  <button 
                    type="button"
                    onClick={onClose}
                    className="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-xl transition font-medium"
                  >
                    取消
                  </button>
                  <button 
                    type="submit"
                    className="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-4 py-2 rounded-xl transition shadow-md shadow-indigo-200"
                  >
                    儲存變更
                  </button>
                </div>
              </div>
            </form>
          </div>
        </div>
      );
    }

    function HistoryModal({ history, onClose }) {
      return (
        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-white border border-slate-200 rounded-2xl w-full max-w-lg p-6 shadow-2xl space-y-4 max-h-[80vh] flex flex-col text-slate-800">
            <div className="flex justify-between items-center border-b border-slate-100 pb-3">
              <h3 className="font-bold text-lg text-slate-900 flex items-center gap-2">
                <i className="fa-solid fa-clock-rotate-left text-indigo-600"></i>
                共編修改歷程紀錄
              </h3>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600">
                <i className="fa-solid fa-xmark text-lg"></i>
              </button>
            </div>

            <div className="flex-1 overflow-y-auto space-y-2.5 pr-1 text-xs">
              {history.length === 0 ? (
                <p className="text-center text-slate-400 py-8">尚無任何修改紀錄</p>
              ) : (
                history.map((log, index) => (
                  <div key={index} className="bg-slate-50 p-3 rounded-xl border border-slate-200 flex items-start justify-between">
                    <div>
                      <span className="font-bold text-indigo-700 mr-2">{log.user}</span>
                      <span className="text-slate-700">{log.action}</span>
                    </div>
                    <span className="text-[10px] font-mono text-slate-400 shrink-0 ml-2">{log.timestamp}</span>
                  </div>
                ))
              )}
            </div>
          </div>
        </div>
      );
    }

    function GraduationRulesView() {
      return (
        <div className="bg-white rounded-2xl border border-slate-200 p-6 space-y-6 max-w-4xl mx-auto shadow-sm">
          <div>
            <h2 className="text-xl font-bold text-slate-900 mb-2 flex items-center gap-2">
              <i className="fa-solid fa-scroll text-indigo-600"></i>
              116學年度 數遊系日間學士班 畢業條件規範說明
            </h2>
            <p className="text-xs text-slate-500">摘錄自實踐大學商學與資訊學院數位多媒體遊戲設計學系 116學年度新生適用課程計畫表</p>
          </div>

          <div className="grid md:grid-cols-2 gap-4 text-xs">
            <div className="bg-slate-50 p-4 rounded-2xl border border-slate-200 space-y-2">
              <h3 className="font-bold text-sm text-indigo-900 border-b border-slate-200 pb-1.5">🎓 學分數規範</h3>
              <ul className="space-y-1.5 text-slate-700 list-disc list-inside">
                <li><strong className="text-slate-900">畢業總學分最低：</strong>128 學分</li>
                <li><strong className="text-slate-900">校訂必修：</strong>18 學分</li>
                <li><strong className="text-slate-900">院訂必修：</strong>6 學分</li>
                <li><strong className="text-slate-900">系訂必修：</strong>51 學分</li>
                <li><strong className="text-slate-900">選修學分：</strong>41 學分</li>
              </ul>
            </div>

            <div className="bg-slate-50 p-4 rounded-2xl border border-slate-200 space-y-2">
              <h3 className="font-bold text-sm text-purple-900 border-b border-slate-200 pb-1.5">🎮 專業學程認證 (三選一)</h3>
              <p className="text-slate-600">須至少完成下列一項學程選修滿 12 學分方可畢業：</p>
              <div className="flex flex-col gap-1.5 pt-1 font-semibold">
                <div className="bg-purple-50 text-purple-800 border border-purple-200 px-3 py-1.5 rounded-xl">1. 互動遊戲設計學程</div>
                <div className="bg-indigo-50 text-indigo-800 border border-indigo-200 px-3 py-1.5 rounded-xl">2. 數位多媒體設計學程</div>
                <div className="bg-emerald-50 text-emerald-800 border border-emerald-200 px-3 py-1.5 rounded-xl">3. 遊戲美術設計學程</div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
